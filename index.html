<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#14181f;--mut:#6b7482;--ac:#7a1a4d;--ac2:#0a84ff;--bd:#e1e5ec;--g:#1fb35a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1016;--card:#181c25;--tx:#eef1f6;--mut:#8a93a3;--ac:#e0568f;--ac2:#4aa3ff;--bd:#272c38}}
:root[data-theme="dark"]{--bg:#0d1016;--card:#181c25;--tx:#eef1f6;--mut:#8a93a3;--ac:#e0568f;--ac2:#4aa3ff;--bd:#272c38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:1000px;margin:0 auto;padding:clamp(12px,3vw,24px) clamp(12px,3vw,24px) 150px}
h1{font-size:clamp(24px,5vw,32px);margin:4px 0 14px;letter-spacing:-.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:20px 4px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer;margin-bottom:0;padding:12px}.card.tap:active{transform:scale(.99)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.cg{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));margin-bottom:10px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));column-gap:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
.stat b{display:block;font-size:clamp(26px,5vw,34px);letter-spacing:-1px}
.stat span{color:var(--mut);font-size:13px}
.stat.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.stat.hero span{color:#ffffffcc}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.06em;margin:14px 2px 6px;text-transform:uppercase}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:13px;min-height:48px;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:9px 15px;min-height:42px;font:inherit;font-size:14px;font-weight:600}
.chip.on{color:#fff;border-color:transparent}
.seg{display:flex;gap:8px}.seg .chip{flex:1;border-radius:12px;padding:12px}
.tag{display:inline-block;color:#fff;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;margin:0 4px 4px 0}
.btn{width:100%;border:0;border-radius:14px;padding:15px;min-height:50px;font:inherit;font-weight:700;background:var(--ac);color:#fff;margin-top:14px}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd);margin-top:8px}
.btn.del{background:none;color:#d33;margin-top:0}
.btn.red{background:#d33}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:6px}
.lbl{width:92px;font-size:12px;font-weight:600}
.n{width:36px;text-align:right;font-size:13px;color:var(--mut)}
.cols{display:flex;align-items:flex-end;gap:4px;height:90px}
.cols div{flex:1;background:linear-gradient(var(--ac2),var(--ac));border-radius:5px 5px 2px 2px;min-height:3px;opacity:.9}
.cols.l{height:auto;margin-top:4px;color:var(--mut);font-size:10px}.cols.l span{flex:1;text-align:center}
.meta{color:var(--mut);font-size:13px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px calc(6px + env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) calc(6px + env(safe-area-inset-left,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;font-weight:600;padding:6px;min-height:50px}
nav button.on{color:var(--ac)}nav button span{display:block;font-size:22px}
#fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:6}
#fab button{width:60px;height:60px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:32px;box-shadow:0 6px 20px #0004}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:99;text-align:center;max-width:90vw}
.ref{margin-top:8px}.ref label{margin:0 0 4px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
textarea.big{min-height:110px;font-size:13px}
.sg{border-radius:12px;overflow:hidden;margin-top:4px}
.sg button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;padding:12px 13px;min-height:46px}
.sg button small{color:var(--mut)}.sg .new{color:var(--ac);font-weight:700}
.info{margin:6px 2px 0;font-size:13px;color:var(--mut)}.info b{color:var(--tx)}
.panel{border:1.5px dashed var(--ac);border-radius:16px;padding:12px;margin-top:10px;background:var(--card)}
.panel label:first-child{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ban{border-radius:20px;padding:16px;color:#fff;margin-bottom:12px}
.ban.on{background:linear-gradient(135deg,#14a85a,#0a7a3c)}
.ban.idle{background:linear-gradient(135deg,#3b4a63,#242c3b)}
.ban.off{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.big2{font-size:clamp(28px,6vw,38px);font-weight:800;letter-spacing:-.5px;line-height:1.15}
.bb{flex:1 1 120px;border:0;border-radius:12px;padding:12px;min-height:46px;font:inherit;font-weight:700;background:#ffffff33;color:#fff;margin-top:10px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:18px;margin-bottom:12px;padding:0 12px 4px}
.day summary{padding:14px 2px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}
.day summary::-webkit-details-marker{display:none}
.day .card{background:var(--bg)}
.gh{display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px}
.gh.act{border-left:4px solid var(--g);padding-left:8px}
.gh .chip{padding:6px 12px;min-height:38px}
.live{color:var(--g);font-weight:800;font-size:12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sbtn{background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:14px;text-align:left;color:var(--tx);font:inherit;min-height:80px}
.sbtn b{display:block;font-size:17px}.sbtn span{color:var(--mut);font-size:13px}
.sbtn.live{border-color:var(--g)}
#sheet{display:none;position:fixed;inset:0;z-index:20;background:#0009;overflow:auto;-webkit-overflow-scrolling:touch}
#sheet.open{display:block}
.sh{background:var(--bg);min-height:100%;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.x{border:0;background:var(--card);color:var(--tx);width:44px;height:44px;border-radius:50%;font-size:18px}
.dflt{font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:-1px;line-height:1.05;margin:10px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.tile small{display:block;color:var(--mut);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tile b{font-size:22px}
.pic{width:100%;border-radius:14px;margin-top:10px;display:block}
@media(min-width:720px){#sheet{padding:30px 0}.sh{border-radius:24px;min-height:0}}
@media(min-width:900px){

 #app{padding-left:120px;max-width:1120px}#fab{bottom:24px}
}
@media(max-height:480px){#app{padding-bottom:110px}}

.savebar .btn{margin:0}
.tw{overflow-x:auto}
.rtab{width:100%;border-collapse:collapse;font-size:12px;background:var(--card)}
.rtab th,.rtab td{border:1px solid var(--bd);padding:5px 6px;text-align:left;vertical-align:top}
.rtab th{background:var(--bg)}
.rt{margin:6px 0}
.sh.wide{max-width:1000px}
@media(min-width:900px){.savebar{bottom:0}}

 html,body{background:#fff!important}
 body>*:not(#sheet){display:none!important}

}

.ct{color:var(--mut);font-size:14px;font-style:italic;margin:6px 0}
.cn{font-size:clamp(28px,8vw,38px);font-weight:700;letter-spacing:-.5px;margin:2px 0}
.cmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.cmeta small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-family:-apple-system,system-ui,sans-serif}.cmeta b{font-size:13px}
.seal{margin:16px auto 0;width:68px;height:68px;border-radius:50%;border:2px solid #b8903a;display:grid;place-items:center;box-shadow:0 0 0 4px var(--card),0 0 0 5px #b8903a55}
.sh,.noprint{}
@media print{#splash{display:none!important}}
.tcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.tl{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.catch{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--ac2);color:#fff;font:inherit;font-weight:700;font-size:17px}

.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}

.chip.sm{padding:5px 12px;min-height:34px;font-size:13px;display:inline-flex;align-items:center;cursor:pointer}
.sbtn{cursor:pointer}
.t24{display:flex;align-items:center;gap:6px}
.t24 select{width:auto;flex:1;min-width:72px;font-size:20px;font-weight:700;text-align:center;padding:10px 4px}
.t24 b{font-size:20px}

.otag{display:inline-block;background:#f5b301;color:#1b1b1b;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;margin:0 6px;vertical-align:middle}
.bb.sel{background:#fff;color:#0a7a3c}
.bb.yel{background:#f5b301;color:#1b1b1b}

async function sheetPost(body){
 const r=await fetch(S.mt.sheetUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
 const j=await r.json();if(!j||!j.ok)throw new Error((j&&j.error)||"Bad response from the sheet");return j;
}
async function cloudSync(manual){
 if(S.syncing)return;const url=S.mt.sheetUrl;
 if(!url){S.msg="Add your Google Sheets URL first";if(manual)toast(S.msg);return}
 S.syncing=true;S.msg="Syncing…";if(S.tab==="set")render();
 try{
  const r=await fetch(url+(url.includes("?")?"&":"?")+"action=pull"),j=await r.json();
  const remote={};(j.rows||[]).forEach(x=>{remote[x.id]=x});
  const tomb=S.mt.tomb||{};let down=0,up=0;const LM=new Map(S.data.map(e=>[e.id,e])),batch=[];
  Object.values(remote).forEach(x=>{
   let w;try{w=JSON.parse(x.json)}catch(e){return}
   if(tomb[w.id])return;
   const l=LM.get(w.id);
   if(!l||x.u>l.u){const ne=norm(Object.assign({},w,{photos:l?l.photos:[]}));if(l)Object.assign(l,ne);else S.data.push(ne);batch.push(ne);down++}
  });
  await bulk(batch);
  const push=S.data.filter(e=>!remote[e.id]||e.u>remote[e.id].u);
  for(let i=0;i<push.length;i+=100){await sheetPost({action:"push",rows:push.slice(i,i+100).map(sheetRow)});up+=Math.min(100,push.length-i)}
  const ids=Object.keys(tomb).map(Number);
  if(ids.length){await sheetPost({action:"delete",ids});S.mt.tomb={}}
  S.mt.last=Date.now();await saveMt();
  S.msg="Synced ✓  ↑"+up+"  ↓"+down;if(manual)toast("Google Sheets sync done");
 }catch(err){S.msg="Sync failed: "+(err&&(err.message||err.code)||"check the URL and internet");if(manual)toast("Sync failed")}
 S.syncing=false;if(S.tab!=="add")render();
}

/* ---- activation ---- */
const b64e=u=>btoa(String.fromCharCode(...u));
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbk(code,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveBits"]);return b64e(new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64d(salt),iterations:100000},k,256)))}
const okEntry=(l,hh)=>(l.codes||[]).find(c=>c.h===hh&&(!c.exp||c.exp>=dkey(new Date())));
async function fetchList(){
 const ctl=typeof AbortController!=="undefined"?new AbortController():null,tm=ctl?setTimeout(()=>ctl.abort(),6000):null;
 try{const r=await fetch("activation.json?t="+Date.now(),{cache:"no-store",signal:ctl?ctl.signal:undefined});if(!r.ok)throw new Error("bad");return await r.json()}finally{if(tm)clearTimeout(tm)}
}
const newId=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"d"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
async function jget(base,params){
 const ctl=typeof AbortController!=="undefined"?new AbortController():null,tm=ctl?setTimeout(()=>ctl.abort(),15000):null;
 try{const r=await fetch(base+(base.includes("?")?"&":"?")+new URLSearchParams(params).toString(),{cache:"no-store",signal:ctl?ctl.signal:undefined});return await r.json()}finally{if(tm)clearTimeout(tm)}
}
async function checkAccess(){
 if(!S.mt.dev){S.mt.dev=newId();await saveMt()}
 const a=S.mt.act;
 if(!a){S.lock="need";try{const l=await fetchList();S.srv=l.server||""}catch(e){}return}
 try{
  const l=await fetchList();S.srv=l.server||"";
  if(a.srv){
   if(!S.srv)throw new Error("no server");
   const r=await jget(S.srv,{action:"status",device:S.mt.dev});
   if(!r||!r.ok)throw new Error("bad answer");
   if(r.status!=="approved"){S.mt.act=null;await saveMt();S.lock="revoked";return}
   a.chk=Date.now();await saveMt();S.lock="";return;
  }
  const c=okEntry(l,a.h);
  if(!c){S.mt.act=null;await saveMt();S.lock="revoked";return}
  a.name=c.name;a.owner=!!c.owner;a.chk=Date.now();await saveMt();S.lock="";
 }catch(e){S.lock=(Date.now()-(a.chk||a.at||0)>30*864e5)?"offline":""}
}
let _bad=0,_wait=0;
async function activate(){
 const inp=$("#acode"),raw=((inp&&inp.value)||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
 if(Date.now()<_wait){toast("Too many tries. Wait a moment.");return}
 if(/^\d{6}$/.test(raw)){
  if(!S.srv){toast("Email codes are not set up. Use your 12-character code.");return}
  try{
   const r=await jget(S.srv,{action:"verify",device:S.mt.dev,code:raw,name:S.reqName||""});
   if(!r||!r.ok){if(++_bad>=5){_wait=Date.now()+30000;_bad=0}toast((r&&r.error)||"Wrong or expired code");return}
   S.mt.act={id:"srv",srv:true,name:r.name||S.reqName||"",owner:false,at:Date.now(),chk:Date.now()};await saveMt();S.lock="";S.tab="shift";render();toast("Activated ✓");
  }catch(e){toast("Could not reach the server. Check your internet.")}
  return;
 }
 if(raw.length<10){toast("Enter the full code");return}
 try{
  const l=await fetchList(),hh=await pbk(raw,l.salt),c=okEntry(l,hh);
  if(!c){if(++_bad>=5){_wait=Date.now()+30000;_bad=0}toast("Wrong or expired code");return}
  S.mt.act={id:c.id,name:c.name,owner:!!c.owner,h:hh,at:Date.now(),chk:Date.now()};await saveMt();S.lock="";S.tab="shift";render();toast("Activated ✓");
 }catch(e){toast("Could not check the code. Connect to the internet and try again.")}
}

async function runUpdate(force){

 const st=(t,p)=>{const e=document.getElementById("upst"),b=document.querySelector("#upbar i");if(e)e.textContent=(p!=null?Math.round(p)+"%  ·  ":"")+t;if(b&&p!=null)b.style.width=p+"%"};

  st("Checking for a new version…",6);

  const est=[...document.scripts].reduce((a,s)=>a+(s.text||"").length,0)+20000;
  let total=+(r.headers&&r.headers.get&&r.headers.get("content-length"))||0;if(!total)total=est;
  let txt="",got=0;
  if(r.body&&r.body.getReader){
   const rd=r.body.getReader(),dec=new TextDecoder();
   for(;;){const x=await rd.read();if(x.done)break;got+=x.value.length;txt+=dec.decode(x.value,{stream:true});st("Downloading the new version… "+Math.round(got/1024)+" KB",8+Math.min(.98,got/Math.max(total,got+1))*52)}
  }else{txt=await r.text();st("Downloaded.",60)}
  const m=txt.match(new RegExp('const BUILD="'+'([^"]+)"')),nb=m?m[1]:"";
  if(nb===BUILD&&!force){
   st("You already have the latest version ("+BUILD+").",100);
   _upBusy=false;if(go){go.disabled=false;go.textContent="Reinstall anyway";go.onclick=()=>runUpdate(true)}return;

  reloadApp();
 }catch(e){
  _upBusy=false;if(go){go.disabled=false;go.textContent="Try again"}
  st("Could not update: "+((e&&e.message)||"check your internet")+".");
 }
}

function backupDue(){const r=S.mt.rem||"weekly";if(r==="off"||!S.data.length)return false;return Date.now()-lastBackup()>(r==="daily"?20*36e5:6.5*864e5)}

 const d=dkey(new Date());
 const ok=kind==="csv"?await dl("works-"+d+".csv",csv()):await dl("works-backup-"+d+".json",JSON.stringify({d:S.data,c:CU}));
 if(ok){S.mt.lbk=Date.now();saveMt();render();toast("Backup saved ✓")}
}
function setRem(v){S.mt.rem=v;saveMt();render()}

/* ---- directions, 24h pickers, MHL, shift runs ---- */
const DIRT=["LDL","MDL","MHL"];
const T24H={};
["rcv","rep","eng","fol","st","en"].forEach(k=>{T24H["tw_"+k]=v=>setT(k,v)});
T24H.arr=v=>{S.D.arr=v};T24H.dep=v=>{S.D.dep=v};T24H.ts=v=>{S.D.ts=S.D.ts.slice(0,10)+"T"+(v||"00:00")};
function t24(key,val,id){
 const p=(val||"").split(":"),hh=p[0]||"",mi=p[1]||"";
 const H=Array.from({length:24},(_,i)=>p2(i)),M=Array.from({length:60},(_,i)=>p2(i));
 return `<div class="t24" data-k="${key}"${id?` id="${id}"`:""}><select class="th" onchange="t24c(this)"><option value="">--</option>${H.map(x=>`<option ${x===hh?"selected":""}>${x}</option>`).join("")}</select><b>:</b><select class="tm" onchange="t24c(this)"><option value="">--</option>${M.map(x=>`<option ${x===mi?"selected":""}>${x}</option>`).join("")}</select></div>`;
}
function t24c(el){
 const w=el.parentNode,th=w.querySelector(".th"),tm=w.querySelector(".tm");
 if(th.value&&!tm.value)tm.value="00";
 if(!th.value&&tm.value)th.value="00";
 const v=th.value&&tm.value?th.value+":"+tm.value:"",f=T24H[w.dataset.k];if(f)f(v);
}
function t24v(id){const w=document.getElementById(id);if(!w)return"";const h=w.querySelector(".th").value,m=w.querySelector(".tm").value;return h&&m?h+":"+m:""}
function dirOf(o,t){return (o.dirs&&o.dirs[t])||(t==="LDL"&&o.ldl)||""}
function dirsOn(D){return D.types.includes("TOWING")?[]:DIRT.filter(t=>D.types.includes(t))}
function anyTurn(D){return dirsOn(D).some(t=>D.dirs[t]==="TURN")}
function needArr(D){return dirsOn(D).some(t=>D.dirs[t]==="ARR"||D.dirs[t]==="TURN")}
function needDep(D){const on=dirsOn(D);return !on.length||on.some(t=>D.dirs[t]==="DEP"||D.dirs[t]==="TURN")}
function setDir(t,v){S.D.dirs[t]=v;render()}
function timesTxt(e){return e.arr&&e.dep?e.arr+" → "+e.dep:e.arr?"Arr "+e.arr:e.dep?"Dep "+e.dep:""}
function mhlSummary(e){const m=e.mhl;if(!m)return"";const p=[];if(m.rep)p.push("Rep "+hm(m.rep));if(m.st)p.push("Start "+hm(m.st));if(m.fin)p.push("Fin "+hm(m.fin));if(m.fp)p.push("1st pax "+hm(m.fp));if(m.pl)p.push("Pax loading "+(m.pl==="Y"?"Yes":"No"));return p.length?"MHL: "+p.join(" · "):""}
function mhlTiles(e,tile){const m=e.mhl||{};return `<h2>MHL</h2><div class="tiles">${tile("Report time",hm(m.rep))}${tile("Start",hm(m.st))}${tile("Finished",hm(m.fin))}${tile("First passenger report",hm(m.fp))}${tile("Passenger loading",m.pl==="Y"?"Yes":m.pl==="N"?"No":"")}</div>`}
["rep","st","fin","fp"].forEach(k=>{T24H["mh_"+k]=v=>setM(k,v)});
function catchM(k){S.D.mhl[k]=lt(new Date());render()}
function clrM(k){S.D.mhl[k]="";render()}
function setM(k,v){if(!v){S.D.mhl[k]="";render();return}S.D.mhl[k]=(S.D.mhl[k]||lt(new Date())).slice(0,10)+"T"+v;render()}
function setPL(v){S.D.mhl.pl=S.D.mhl.pl===v?"":v;render()}
function mhlPanel(){
 const m=S.D.mhl;
 const one=(k,l)=>`<div class="tcard"><div class="tl">${l}</div>${m[k]?`<div class="row">${t24("mh_"+k,hm(m[k]))}<button class="chip" onclick="clrM('${k}')">Clear</button></div>`:`<button class="catch" onclick="catchM('${k}')">⏱ Catch time</button>`}</div>`;
 const yn=(v,l)=>`<button class="chip ${m.pl===v?"on":""}" style="${m.pl===v?"background:"+(v==="Y"?"#1f9d55":"#d33"):""}" onclick="setPL('${v}')">${l}</button>`;
 return `<label style="color:#8e5a2b">MHL</label><div class="tgrid">${one("rep","Report time")}${one("st","Start")}${one("fin","Finished")}${one("fp","First passenger report time")}</div><div class="tcard" style="margin-top:10px"><div class="tl">Passenger loading</div><div class="seg">${yn("Y","Yes")}${yn("N","No")}</div></div>`;
}
function runKey(id,sd){return id+"|"+sd}
function runOf(id,sd){return (CU.W||{})[runKey(id,sd)]||null}
function isRunning(id,sd){const r=runOf(id,sd);if(!r)return false;return r.run!==undefined?!!r.run:!!(r.st&&!r.en)}
function otOf(id,sd){const r=runOf(id,sd);return r&&+r.ot>0?+r.ot:0}
const hrTxt=x=>Number.isInteger(x)?String(x):x.toFixed(1);
function otTag(x){return x>0?`<span class="otag">EOT-${hrTxt(x)}hr</span>`:""}
function setRun(on){const c=S.cur;CU.W=CU.W||{};const k=runKey(c.id,c.sd),r=CU.W[k]||{};r.run=on;CU.W[k]=r;save();render()}
function shiftStart(){setRun(true);toast("Shift started")}
function shiftFinish(){setRun(false);toast("Shift ended")}
function addOT(dx){
 const c=S.cur;CU.W=CU.W||{};const k=runKey(c.id,c.sd),r=CU.W[k]||{run:false},cur=+r.ot||0;
 if(dx>0&&cur>=6){toast("Maximum is 6 hours");return}
 r.ot=Math.max(0,Math.min(6,cur+dx));CU.W[k]=r;save();render();toast(r.ot?"OT "+hrTxt(r.ot)+" hr":"OT cleared");
}
function clearOT(){const c=S.cur,r=runOf(c.id,c.sd);if(r){r.ot=0;save();render();toast("OT cleared")}}
function otMonthH(){const m=dkey(new Date()).slice(0,7);return otEntries().filter(e=>e.sd.slice(0,7)===m).reduce((a,e)=>a+e.h,0)}
function otEntries(){return Object.entries(CU.W||{}).filter(([k,r])=>r&&+r.ot>0).map(([k,r])=>{const i=k.lastIndexOf("|");return{id:k.slice(0,i),sd:k.slice(i+1),h:+r.ot}})}
function otDay(sd){return otEntries().filter(e=>e.sd===sd).reduce((a,e)=>a+e.h,0)}
function weekStart(sd){const x=new Date(sd+"T00:00:00"),w0=S.mt.wk0===1?1:0;x.setDate(x.getDate()-((x.getDay()-w0+7)%7));return dkey(x)}
function otSection(){
 const td=dkey(new Date()),ws=weekStart(td),all=otEntries();
 const wk=all.filter(e=>weekStart(e.sd)===ws).reduce((a,e)=>a+e.h,0);
 const mo=all.filter(e=>e.sd.slice(0,7)===td.slice(0,7)),mh=mo.reduce((a,e)=>a+e.h,0);
 const weeks=[];for(let i=5;i>=0;i--){const d=new Date(ws+"T00:00:00");d.setDate(d.getDate()-7*i);const k=dkey(d);weeks.push({k,d,h:all.filter(e=>weekStart(e.sd)===k).reduce((a,e)=>a+e.h,0)})}
 const mx=Math.max(1,...weeks.map(w=>w.h));
 const dayList=mo.slice().sort((a,b)=>b.sd.localeCompare(a.sd)).map(e=>`<div class="row sp" style="padding:5px 0"><span>${otTag(e.h)}<b>${nice(e.sd)}</b></span><span class="meta">${esc(shName(e.id))}</span></div>`).join("")||'<div class="meta">No OT this month</div>';
 return `<h2>Overtime (OT)</h2><div class="grid"><div class="stat"><b style="color:#e0a100">${hrTxt(wk)} h</b><span>OT this week</span></div><div class="stat"><b style="color:#e0a100">${hrTxt(mh)} h</b><span>OT this month</span></div><div class="stat"><b>${new Set(mo.map(e=>e.sd)).size}</b><span>OT days this month</span></div></div>
 <div class="g2"><div class="card"><div class="tl">OT hours per week</div><div class="cols">${weeks.map(w=>`<div style="height:${w.h/mx*100}%;background:#f5b301" title="${hrTxt(w.h)}h"></div>`).join("")}</div><div class="cols l">${weeks.map(w=>`<span>${w.d.getDate()}/${w.d.getMonth()+1}<br>${hrTxt(w.h)}h</span>`).join("")}</div></div>
 <div class="card"><div class="tl">OT days this month</div>${dayList}<button class="btn sec" onclick="doOtCsv()">Download OT CSV</button></div></div>`;
}
function otCsv(){const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';return [["DATE","SHIFT","OT_HOURS"].map(q).join(",")].concat(otEntries().sort((a,b)=>a.sd.localeCompare(b.sd)).map(e=>[e.sd,shName(e.id),e.h].map(q).join(","))).join("\n")}
async function doOtCsv(){await dl("ot-"+dkey(new Date()).slice(0,7)+".csv",otCsv())}
function setWk(v){S.mt.wk0=v;saveMt();render()}
function runningCards(){
 return Object.keys(CU.W||{}).filter(k=>{const i=k.lastIndexOf("|");return isRunning(k.slice(0,i),k.slice(i+1))}).map(k=>{const i=k.lastIndexOf("|"),id=k.slice(0,i),sd=k.slice(i+1);return `<button class="ban on" style="width:100%;border:0;text-align:left;font:inherit" onclick="start('${esc(id)}','${sd}')"><div class="row sp"><b>● Running shift${otTag(otOf(id,sd))}</b><span>${nice(sd)}</span></div><div class="big2">${esc(shName(id))}</div><div style="font-weight:700;margin-top:6px">Tap to continue ▸</div></button>`}).join("");
}
function setTheme(t){S.mt.theme=t;const r=document.documentElement;if(r.setAttribute){t==="auto"?r.removeAttribute("data-theme"):r.setAttribute("data-theme",t)}saveMt();render()}

 return `<div style="text-align:center;padding:10px 0">${logo(96)}<h1 style="margin:10px 0 0">Works Log</h1><div class="meta">by <b>Jamshi Solutions</b> · Version 1.6</div>${S.mt.act?`<div class="meta">Activated for ${esc(S.mt.act.name||"")}</div>`:""}</div>
